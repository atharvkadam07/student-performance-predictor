<!DOCTYPE html>
<html>
<head>

    <title>Student Performance Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Student Performance Predictor</h1>

    <label>Study Hours</label>
    <input type="number" id="study_hours" step="0.1">

    <label>Attendance (%)</label>
    <input type="number" id="attendance" step="0.1">

    <label>Assignment Score</label>
    <input type="number" id="assignment_score" step="0.1">

    <label>Previous Exam Score</label>
    <input type="number" id="previous_score" step="0.1">

    <label>Sleep Hours</label>
    <input type="number" id="sleep_hours" step="0.1">

    <button onclick="predict()">Predict Performance</button>

    <div id="result"></div>

</div>


<script>

async function predict() {

    const data = {
        study_hours: document.getElementById("study_hours").value,
        attendance: document.getElementById("attendance").value,
        assignment_score: document.getElementById("assignment_score").value,
        previous_score: document.getElementById("previous_score").value,
        sleep_hours: document.getElementById("sleep_hours").value
    };

    const response = await fetch("/predict", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(data)

    });

    const result = await response.json();

    if (result.error) {

        document.getElementById("result").innerHTML =
            "Error: " + result.error;

    } else {

        document.getElementById("result").innerHTML =
            "Predicted Score: " + result.predicted_score +
            "<br>Performance: " + result.performance;
    }
}

</script>

</body>
</html>
